[package]
name = "udigest"
version = "0.10.0"
edition.workspace = true
license = "MIT OR Apache-2.0"
description = "Unambiguously digest structured data"
repository = "https://github.com/LFDT-Lockness/udigest"
categories = ["algorithms", "cryptography", "no-std", "no-std::no-alloc"]
keywords = ["hashing", "unambiguous-encoding"]
readme = "../README.md"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
digest = { version = "0.10", default-features = false }
udigest-encoding = { version = "=0.10.0", path = "../udigest-encoding", default-features = false }

[dev-dependencies]
hex = "0.4"

sha2 = "0.10"
sha3 = "0.10"
blake2 = "0.10"

trybuild = "1"

[features]
default = ["std", "inline-struct"]

std = ["udigest-encoding/std"]
alloc = ["udigest-encoding/alloc"]
derive = ["udigest-encoding/derive"]
inline-struct = ["udigest-encoding/inline-struct"]

[[test]]
name = "derive"
required-features = ["std", "derive"]

[[test]]
name = "derive_encoding"
required-features = ["std", "derive"]

[[test]]
name = "derive_compile_fails"
required-features = ["std", "derive"]

[[test]]
name = "deterministic_hash"
required-features = ["derive"]

[[test]]
name = "diff_structs_same_encoding"
required-features = ["derive"]

[[test]]
name = "inline_struct"
required-features = ["derive", "inline-struct"]

[[test]]
name = "digest_as"
required-features = ["derive", "inline-struct"]

[[example]]
name = "derivation"
required-features = ["std", "derive"]

