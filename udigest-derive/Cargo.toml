[package]
name = "udigest-derive"
version = "0.6.0"
edition.workspace = true
description = "Proc macro for `udigest` and `udigest-encoding` crates"
license = "MIT OR Apache-2.0"
repository = "https://github.com/LFDT-Lockness/udigest"

[lib]
proc-macro = true
path = "src/lib.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
syn = "2"
quote = "1"
proc-macro2 = "1"
proc-macro-crate = "3"
